version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: rulebot_db
    restart: always
    environment:
      POSTGRES_USER: rulebot_user
      POSTGRES_PASSWORD: rulebot_pass
      POSTGRES_DB: rulebot_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rulebot_user -d rulebot_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: rulebot_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://rulebot_user:rulebot_pass@db:5432/rulebot_db
      - JWT_SECRET=rulebot_secret_key_super_secure_1234567890
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: rulebot_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data:
